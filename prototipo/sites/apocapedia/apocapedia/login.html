<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Apocapedia</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg"></div>

  <div class="card">
    <div class="logo">apocapedia</div>

    <main class="page">
      <h1>Login</h1>

      <img class="info-icon" src="assets/info.png" alt="">
      <p class="welcome">Welcome! To enter apocapedia you need an account first.</p>

      <form class="login-form" id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="off">

        <label for="password">Password</label>
        <input type="password" id="password">

        <div class="remember">
          <input type="checkbox" id="keeplogin" name="keeplogin">
          <label for="keeplogin">Keep me logged-in</label>
        </div>

        <button type="submit" id="login-button">Log in</button>

        <dialog class="box" id="forgot-dialog">
          <h2>Forgot your password?</h2>
          <p>We are really sorry about that.</p>
          <button id="forgot-close">Close</button>
        </dialog>

        <div class="help-links">
          <a href="#help">I need help</a>
          <a href="#forgot">I forgot my password</a>
        </div>
      </form>
    </main>
  </div>
</body>

</html>
